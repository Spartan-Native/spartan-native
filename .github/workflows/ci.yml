# Formatting, lint, unit tests, library builds and a check of what each package would publish,
# on every pull request and every push to main.
#
# The visual tests (npm run test:visual) do not run here: their baselines are per operating
# system and are not committed. Run them locally.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build and check packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build packages
        run: npm run build:libs

      - name: Check packages
        run: npm run check:packages
