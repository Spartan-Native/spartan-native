# Publishes every @spartan-native/* package listed in scripts/libraries.mjs to npmjs.org when a
# release tag is pushed, then creates a GitHub Release from the matching CHANGELOG.md section.
#
# Release tags (a leading "v" is optional):
#   1.2.3 / v1.2.3                 -> published as 1.2.3 with dist-tag "latest"
#   1.2.3-beta / v1.2.3-beta.4     -> published as 1.2.3-beta.4 with dist-tag "beta"
#
# Any other tag (or a branch push) does not publish anything.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# npm authentication, either:
#   - Trusted publishing (preferred): on npmjs.com, in each package's settings, add this
#     repository and workflow file (release.yml) as a trusted publisher. No secret needed.
#     A package must exist before it can have a trusted publisher, so the first release
#     uses a token.
#   - A granular access token with publish rights on the @spartan-native scope, stored as the
#     repository secret NPM_TOKEN. Delete the secret once trusted publishing is set up.
#
# Provenance statements are added while the repository is public (npm refuses them for
# private repositories).
#
# Re-running the workflow is safe: versions already on npm are skipped.

name: Release packages

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      dist-tag: ${{ steps.parse.outputs.dist-tag }}
    steps:
      - id: parse
        name: Parse semantic version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable release ${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "dist-tag=beta" >> "$GITHUB_OUTPUT"
            echo "Beta release ${BASH_REMATCH[1]}"
          else
            echo "::notice::Tag '$TAG' is not major.minor.patch or major.minor.patch-beta[.n]; nothing to publish."
          fi

  publish:
    name: Build and publish
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DIST_TAG: ${{ needs.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build packages
        run: npm run build:libs

      - name: Stamp version ${{ env.VERSION }}
        run: node scripts/stamp-release.mjs "$VERSION"

      - name: Check packages
        run: npm run check:packages

      - name: Publish to npm (${{ env.DIST_TAG }})
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}
        run: |
          # Dependencies first: scripts/libraries.mjs is in dependency order.
          for lib in $(node scripts/libraries.mjs); do
            name=$(node -p "require('./dist/$lib/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm, skipping."
              continue
            fi
            npm publish "./dist/$lib" --tag "$DIST_TAG" --access public $PROVENANCE
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # The CHANGELOG.md section "## [<version>] ..." up to the next "## [",
          # without the "[x]: url" link definitions at the end of the file.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          prerelease=""
          [[ "$DIST_TAG" == "beta" ]] && prerelease="--prerelease"
          if [[ -s release-notes.md ]]; then
            gh release create "$TAG" --title "$VERSION" --notes-file release-notes.md $prerelease
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using generated notes."
            gh release create "$TAG" --title "$VERSION" --generate-notes $prerelease
          fi
