<aside class="controls" aria-label="Appearance">
  <h1>Spartan Native</h1>
  <p class="hint">The window on the right is built from stock spartan/ui and desktop-ui components.</p>

  <label class="field">
    <span>Skin</span>
    <hlm-native-select [value]="theme.skin()" (valueChange)="setSkin($event)">
      @for (skin of skins; track skin.value) {
        <option hlmNativeSelectOption [value]="skin.value">{{ skin.label }}</option>
      }
    </hlm-native-select>
  </label>

  <div class="field">
    <span id="scheme-label">Appearance</span>
    <hlm-toggle-group
      type="single"
      variant="outline"
      size="sm"
      [nullable]="false"
      aria-labelledby="scheme-label"
      [value]="theme.scheme()"
      (valueChange)="setScheme($event)"
    >
      <button hlmToggleGroupItem value="light">Light</button>
      <button hlmToggleGroupItem value="dark">Dark</button>
    </hlm-toggle-group>
  </div>

  <div class="field">
    <span id="accent-label">Accent</span>
    <div class="swatches" role="group" aria-labelledby="accent-label">
      @for (accent of accents; track accent) {
        <button
          type="button"
          class="swatch"
          [style.background]="accent"
          [attr.aria-label]="accent"
          [attr.aria-pressed]="theme.appearance().accent === accent"
          (click)="setAccent(accent)"
        ></button>
      }
      <input
        type="color"
        class="swatch"
        aria-label="Any accent"
        [value]="theme.appearance().accent"
        (input)="setAccent($any($event.target).value)"
      />
    </div>
  </div>

  <!-- An id of its own: spartan's switch names itself after its label's id. -->
  <label class="field row" id="reduce-transparency-label">
    <span>Reduce transparency</span>
    <hlm-switch
      [checked]="theme.appearance().reduceTransparency"
      (checkedChange)="theme.override({ reduceTransparency: $event })"
    />
  </label>

  <label class="field row" id="window-focused-label">
    <span>Window focused</span>
    <hlm-switch [checked]="theme.focused()" (checkedChange)="theme.focused.set($event)" />
  </label>

  <button hlmBtn variant="outline" [disabled]="theme.followsSystem()" (click)="theme.followSystem()">
    Follow the system
  </button>
</aside>

<main class="sn-window window">
  <sn-title-bar title="Harbor Backup" subtitle="Playground" />

  <sn-command-bar title="Documents">
    <button snCommand icon="lucidePlus" label="New" variant="accent" (click)="empty.set(false)"></button>
    <button snCommand icon="lucideShare2" label="Share" priority="1"></button>
    <button snCommand icon="lucideTrash2" label="Delete all" (click)="empty.set(true)"></button>
  </sn-command-bar>

  <div class="sn-content content">
    @if (empty()) {
      <sn-status-page
        icon="lucideArchive"
        title="No backups yet"
        description="Add a destination to start protecting your files."
      >
        <button hlmBtn (click)="empty.set(false)">Add destination</button>
      </sn-status-page>
    } @else {
      <sn-settings-group title="General" description="Settings render the way each OS draws them.">
        <sn-settings-row title="Launch at login" subtitle="Start in the background when you sign in">
          <ng-icon snSettingsIcon name="lucidePower" />
          <hlm-switch
            aria-label="Launch at login"
            [checked]="launchAtLogin()"
            (checkedChange)="launchAtLogin.set($event)"
          />
        </sn-settings-row>
        <sn-settings-row *snPlatformIf="'macos'; else trayRow" title="Show in menu bar">
          <ng-icon snSettingsIcon name="lucideBell" />
          <hlm-switch
            aria-label="Show in menu bar"
            [checked]="notifications()"
            (checkedChange)="notifications.set($event)"
          />
        </sn-settings-row>
        <ng-template #trayRow>
          <sn-settings-row title="Show in system tray">
            <ng-icon snSettingsIcon name="lucideBell" />
            <hlm-switch
              aria-label="Show in system tray"
              [checked]="notifications()"
              (checkedChange)="notifications.set($event)"
            />
          </sn-settings-row>
        </ng-template>
        <sn-settings-row title="Backup folder">
          <ng-icon snSettingsIcon name="lucideFolder" />
          <input hlmInput aria-label="Backup folder" value="~/Documents" />
        </sn-settings-row>
      </sn-settings-group>

      <section class="buttons" aria-label="Buttons">
        <button hlmBtn>Default</button>
        <button hlmBtn variant="outline">Standard</button>
        <button hlmBtn variant="secondary">Secondary</button>
        <button hlmBtn variant="ghost">Flat</button>
        <button hlmBtn variant="destructive">Delete</button>
        <button hlmBtn disabled>Disabled</button>
      </section>
    }
  </div>
</main>
